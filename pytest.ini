[pytest]
testpaths = tfp-foundation-protocol/tests tests tfp_core tfp_simulator tfp_ui
pythonpath = . tfp-foundation-protocol tfp_core tfp_simulator tfp_transport tfp_security tfp_plugins tfp_plugin_sdk tfp_ui
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

markers =
    concurrency: marks tests as concurrency tests (deselect with '-m "not concurrency"')
    simulation: marks network simulation and fault injection tests
    fuzz: marks adversarial and fuzz tests
    benchmark: marks performance and throughput benchmark tests
    asyncio: marks asyncio coroutine tests
