services:
  tfp-demo:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: tfp-demo-node
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    volumes:
      - tfp_data:/data
    environment:
      - TFP_DB_PATH=/data/pib.db
      - TFP_MODE=demo
      - TFP_ENABLE_NOSTR=0
      - TFP_ENABLE_IPFS=0
      - TFP_EARN_RATE_MAX=${TFP_EARN_RATE_MAX:-10}
      - TFP_EARN_RATE_WINDOW=${TFP_EARN_RATE_WINDOW:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  tfp_data:
