[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tfp"
version = "4.0.0"
description = "The Foundation Protocol - decentralized content and compute protocol for global information access"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "The Foundation Protocol Contributors", email = "governance@tfp-protocol.org"}
]
keywords = ["decentralized", "content", "compute", "p2p", "nostr", "ipfs", "ndn"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Distributed Computing",
]

# Pure production dependencies ONLY - zero test/dev/fuzz tooling
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-ndn>=0.4.0",
    "websockets>=13.1",
    "cryptography>=43.0.0",
    "prometheus_client>=0.20.0",
    "python-multipart>=0.0.20",
    "zstandard>=0.22.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/Bittermun/TheFoundationProtocol"
Repository = "https://github.com/Bittermun/TheFoundationProtocol"
Documentation = "https://github.com/Bittermun/TheFoundationProtocol/blob/main/README.md"
"Bug Tracker" = "https://github.com/Bittermun/TheFoundationProtocol/issues"
Changelog = "https://github.com/Bittermun/TheFoundationProtocol/blob/main/CHANGELOG.md"

[project.optional-dependencies]
cli = ["httpx>=0.28.0"]
browser = ["playwright>=1.48.0"]
experiments = ["zstandard==0.25.0", "psutil>=5.9.0"]
test = [
    "build>=1.2.0",
    "wheel",
    "setuptools>=61.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "fakeredis>=2.2.0",
    "locust>=2.20.0",
]
fuzz = [
    "hypothesis>=6.100.0",
]
dev = [
    "build>=1.2.0",
    "wheel",
    "setuptools>=61.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "httpx>=0.28.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "black>=24.0.0",
    "ast-grep-cli",
]
# Heavy optional backends — not needed for the core demo node
distributed = [
    "redis>=5.2.0",
]
# PostgreSQL for multi-worker deployments (SQLite is single-worker only)
postgresql = [
    "psycopg2-binary>=2.9.0",
]
rag = [
    "chromadb>=0.4.24",
    "transformers>=4.39.0",
]
tracing = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24.0",
]
security = [
    "cryptography>=43.0.0",
]
all = [
    "tfp[test,fuzz,dev,distributed,postgresql,rag,tracing,security]",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.json", "*.js", "*.css", "*.svg"]
demo = ["*.html", "*.json", "*.js", "assets/*.css", "assets/*.js", "assets/*.svg"]
tfp_demo = ["static/*", "templates/*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.exclude-package-data]
"*" = ["test_*.py", "*_test.py", "*.tests*"]

[project.scripts]
tfp = "tfp_core_v4.cli:main"

[tool.pytest.ini_options]
testpaths = ["tfp-foundation-protocol/tests", "tests"]
pythonpath = [".", "tfp-foundation-protocol", "tfp_core", "tfp_simulator", "tfp_transport", "tfp_security", "tfp_plugins", "tfp_plugin_sdk", "tfp_ui"]
asyncio_mode = "auto"
timeout = 30
markers = [
    "concurrency: tests that exercise thread-safety and concurrent access patterns",
    "simulation: marks network simulation and fault injection tests",
    "fuzz: marks adversarial and fuzz tests",
    "benchmark: marks performance and throughput benchmark tests",
    "asyncio: marks asyncio coroutine tests",
]

[tool.mypy]
python_version = "3.11"
# Generated wheel copies duplicate source modules; never type-check build output.
exclude = ['(^|[/\\])build[/\\]']
warn_return_any = false
warn_unused_configs = false
ignore_missing_imports = true
strict_optional = false
disable_error_code = ["union-attr", "assignment", "return", "arg-type", "call-arg", "dict-item", "index", "operator", "has-type", "list-item", "misc", "valid-type"]
