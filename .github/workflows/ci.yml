name: CI

on:
  push:
    branches: [main, 'codex/**', 'copilot/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - name: Check repository code
        run: python -m ruff check .

  typecheck:
    name: Source type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[test,fuzz]" mypy
      - run: python -m mypy tfp-foundation-protocol --ignore-missing-imports

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12']
        include:
          - os: windows-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[test,fuzz]" pytest-cov
      - name: Run both test trees
        env:
          TFP_DB_PATH: ':memory:'
        run: python -m pytest -q --tb=short --cov=tfp_demo --cov=tfp_client --cov=tfp_cli --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: ignore

  distribution:
    name: Install and run built wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install build
      - run: python -m build
      - name: Check runtime files and tooling isolation
        run: python scripts/check_distribution.py dist/*.whl
      - name: Install into an empty environment and run outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/tfp-runtime"
          "$RUNNER_TEMP/tfp-runtime/bin/python" -m pip install dist/*.whl
          cp scripts/check_installed_visualizer.py "$RUNNER_TEMP/check_installed_visualizer.py"
          cp scripts/check_installed_bulletin.py "$RUNNER_TEMP/check_installed_bulletin.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/tfp-runtime/bin/python" -I -B check_installed_visualizer.py
          "$RUNNER_TEMP/tfp-runtime/bin/python" -I -B check_installed_bulletin.py
          env -u PYTHONPATH "$RUNNER_TEMP/tfp-runtime/bin/python" -m tfp_cli.smoke --json
          env -u PYTHONPATH "$RUNNER_TEMP/tfp-runtime/bin/python" -m tfp_cli.operational_smoke
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-distribution
          path: dist/*

  browser:
    name: Browser journey (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ".[browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_demo_browser.py
      - name: Test bulletin reception from an installed wheel outside the checkout
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/tfp-browser"
          "$RUNNER_TEMP/tfp-browser/bin/python" -m pip install dist/*.whl pytest playwright
          mkdir "$RUNNER_TEMP/bulletin-tests"
          cp tests/test_browser_acoustic_acceptance.py tests/test_bulletin_admission_recovery.py tests/test_checkpoint_admission.py "$RUNNER_TEMP/bulletin-tests/"
          printf '[pytest]\n' > "$RUNNER_TEMP/bulletin-tests/pytest.ini"
          cd "$RUNNER_TEMP/bulletin-tests"
          "$RUNNER_TEMP/tfp-browser/bin/python" -I -B -m pytest -c pytest.ini -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: output/playwright/*.png
          if-no-files-found: ignore
