version: '3.8'

services:
  tfp-workshop:
    build:
      context: .
      dockerfile: Dockerfile.workshop
      target: workshop-dev
    container_name: tfp-workshop
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace:/workspace/tfp-foundation-protocol
      - TFP_DB_PATH=/workspace/pib.db
      - TFP_IPFS_API_URL=http://tfp-ipfs:5001
      - TFP_REDIS_URL=redis://tfp-redis:6379/0
      - NOSTR_RELAY_URL=ws://tfp-relay:8080
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    networks:
      - tfp-network
    # Dependencies are defined in docker-compose.testbed.yml.
    # Kept as external links or managed via scripts/workshop.py multi-file flag.
    depends_on:
      tfp-ipfs:
        condition: service_started
        required: false
      redis:
        condition: service_started
        required: false
      tfp-relay:
        condition: service_started
        required: false
    stdin_open: true
    tty: true

networks:
  tfp-network:
    driver: bridge
